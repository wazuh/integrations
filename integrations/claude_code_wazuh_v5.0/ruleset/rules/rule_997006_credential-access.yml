id: 'f6a8d1b3-9c5e-4f2a-8d4b-6e8a1c3f5b7d'
logsource:
  product: claude-code
tags:
  - attack.credential-access
  - attack.t1552.001
falsepositives:
  - A legitimate task that genuinely requires reading or editing an SSH private key, e.g. provisioning automation
level: high
status: experimental
enabled: true
metadata:
  title: Claude Code File Access Targeting a Credential or Sensitive Path
  author: Anmol Vats
  description: Detects a Read, Write, or Edit tool call whose file_path targets an SSH private key (id_rsa). Scope intentionally narrowed to this single, empirically confirmed pattern; broader credential-path coverage (.aws/credentials, .kube/config, .npmrc, .git-credentials, id_ed25519, .env) was attempted but could not be made to reliably fire against this platform's rule engine and is tracked as a documented gap rather than implemented, per VERIFY.md.
  references:
    - 'https://code.claude.com/docs/en/monitoring-usage'
  documentation: ''
  supports:
    - '5.0'
detection:
  selection:
    process.name:
      - Read
      - Write
      - Edit
  target:
    file.path|re: id_rsa
  condition: selection and target
