title: SSH password authentication attempt failed
id: 8cac8797-9cff-4d03-b7a3-56547372fa99
name: wcp_ssh_failed_password_attempt
status: experimental
description: |
  Selects exactly one normalized event per failed SSH credential attempt.
  OpenSSH writes one "Failed password for [invalid user] <user> from <ip> port <port> ssh2"
  (or "Failed keyboard-interactive/pam ...") line for every rejected password. The stock
  Wazuh 5.0.0-rc1 decoder (decoder/system-auth/0) stores "<event> <method>" of that line in
  event.reason. The other lines of the same attempt ("Invalid user ...", the pam_unix
  "authentication failure" line, "Disconnecting ...: Too many authentication failures",
  "error: maximum authentication attempts exceeded ...", "PAM N more authentication failures")
  are also normalized as event.action=authentication-failure; they are deliberately NOT
  selected, so the count is attempts, not log lines.
references:
  - https://github.com/openssh/openssh-portable/blob/master/auth.c
author: wazuh_correlation_pack contributors
date: 2026-11-21
taxonomy: wcs
logsource:
  product: linux
  service: sshd
  definition: Wazuh 5.0.0-rc1 stock integration system-auth (decoder/system-auth/0), data stream wazuh-events-v5-system-activity
detection:
  selection:
    process.name:
      - sshd
      - sshd-session
      - sshd-auth
    event.reason:
      - Failed password
      - Failed keyboard-interactive/pam
  condition: selection
falsepositives:
  - Users mistyping their password
level: low
