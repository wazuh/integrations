title: Windows password spraying - one source failing against many accounts on one endpoint
id: c0489d1c-c23c-4458-b16f-a521d8d1ec35
name: wcp_windows_password_spray
status: experimental
description: |
  Failed logons (4625) for 5 or more distinct target accounts from the same source IP on the
  same Wazuh agent within any 10-minute event-time window.
  An account is its realm and its name together: wcp.windows_target_account is derived by the
  pack's backend as "<target domain or computer>\<target user>" (lower case) from the target-side
  fields of the stock 5.0.0-rc1 decoding (user.target.name; user.target.domain, or user.domain
  only when user.id equals user.target.id; "." replaced by the reporting computer). The reporting
  subject's identity is never used. Accounts without a known realm are counted as "?\<user>".
  So CONTOSO\bob and FABRIKAM\bob are two accounts; CONTOSO\Bob and contoso\bob are one.
  Definition and limits: wcp/identity.py and README "Detections".
  Scope: one source against one endpoint. Spraying spread across several endpoints (e.g.
  failures recorded on several domain controllers) or several sources, and spraying slower than
  the window, are NOT covered.
author: wazuh_correlation_pack contributors
date: 2026-11-21
modified: 2026-11-22
taxonomy: wcs
correlation:
  type: value_count
  rules:
    - wcp_windows_failed_logon
  group-by:
    - wazuh.agent.id
    - source.ip
  timespan: 10m
  condition:
    field: wcp.windows_target_account
    gte: 5
falsepositives:
  - Vulnerability scanners with credential checks
level: high
