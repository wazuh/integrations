title: SSH password spraying - one source failing against many accounts on one endpoint
id: bfedca0e-4d5f-4c67-908a-029cb98a95ed
name: wcp_ssh_password_spray
status: experimental
description: |
  Failed SSH password attempts for 5 or more distinct user names from the same source IP
  against the same Wazuh agent within any 10-minute event-time window. The identity realm is
  the endpoint: Linux local accounts with the same name on two hosts are different identities,
  so agents are never merged. Repeated failures for one user name count once.
  Scope: one source, one endpoint. Distributed (many sources) and slow (longer than the
  window) spraying are NOT covered.
author: wazuh_correlation_pack contributors
date: 2026-11-21
taxonomy: wcs
correlation:
  type: value_count
  rules:
    - wcp_ssh_failed_password_attempt
  group-by:
    - wazuh.agent.id
    - source.ip
  timespan: 10m
  condition:
    field: user.name
    gte: 5
falsepositives:
  - Vulnerability scanners with credential checks
level: high
