<!--
  Web-to-shell: agent-side configuration (integrations/web_to_shell).
  Merge into /var/ossec/etc/ossec.conf on each web server agent, or push it
  from the manager via centralized config (etc/shared/<group>/agent.conf).
  Adjust paths to your webroots and Node app directories.
-->
<ossec_config>

  <!-- Layer 1: auditd execve events (audit format groups multi-line records) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Layer 2: web access logs (nginx and apache combined format) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <!-- Layer 3: real-time FIM on webroots and Node app code.
       restrict keeps event volume to the file types that matter. Write the
       dots unescaped: on 4.14.8 a pattern like "\.php$" silently matches
       nothing. Matching is case-insensitive (shell.PHTML is caught). -->
  <syscheck>
    <directories realtime="yes" check_all="yes" restrict=".php$|.php5$|.php7$|.phtml$|.phar$|.pht$|.phps$|.htaccess$|.user.ini$">/var/www</directories>
    <directories realtime="yes" check_all="yes" restrict=".js$|.mjs$|.cjs$">/opt/nodeapp</directories>
    <ignore type="sregex">/node_modules/</ignore>
  </syscheck>

</ossec_config>
