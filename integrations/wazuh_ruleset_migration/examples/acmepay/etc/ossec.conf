<!-- Minimal ossec.conf of a Wazuh 4.x manager, written for this tool: only the blocks the migration reads. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.com</smtp_server>
    <email_from>wazuh@example.com</email_from>
    <email_to>soc@example.com</email_to>
    <agents_disconnection_time>10m</agents_disconnection_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories>/etc,/usr/bin,/usr/sbin</directories>
  </syscheck>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
  </wodle>

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/acmepay/gateway.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Block the source of a failed login from a blocked address, and of a brute force -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100205,100203</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Payment alerts of level 12 or more to the payments channel -->
  <integration>
    <name>slack</name>
    <hook_url>https://hooks.slack.com/services/EXAMPLE/EXAMPLE/EXAMPLE</hook_url>
    <level>12</level>
    <group>acmepay</group>
    <alert_format>json</alert_format>
  </integration>

  <!-- Non-authorized currencies and sshd failures to the on-call team -->
  <email_alerts>
    <email_to>payments-oncall@example.com</email_to>
    <rule_id>100204, 5716</rule_id>
    <do_not_delay />
  </email_alerts>

  <ruleset>
    <!-- Stock ruleset -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>

    <!-- Custom ruleset -->
    <list>etc/lists/blocked-ips</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
</ossec_config>
